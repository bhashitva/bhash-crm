# Substitute your hostname and certificate paths. Both workers use the same
# --origin=https://bhashcrm.bhashitva.org and the same PostgreSQL database.
limit_req_zone $binary_remote_addr zone=crm_clients:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=crm_connections:10m;

upstream bhash_crm {
    least_conn;
    server 127.0.0.1:8092;
}

server {
    listen 80;
    server_name bhashcrm.bhashitva.org;
    return 308 https://bhashcrm.bhashitva.org$request_uri;
}

server {
    listen 443 ssl;
    server_name bhashcrm.bhashitva.org;
    ssl_certificate /etc/letsencrypt/live/bhashcrm.bhashitva.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bhashcrm.bhashitva.org/privkey.pem;
    client_max_body_size 64k;
    client_body_timeout 10s;
    limit_req zone=crm_clients burst=20 nodelay;
    limit_conn crm_connections 20;

    location / {
        proxy_pass http://bhash_crm;
        proxy_set_header Host $http_host;
        proxy_set_header Origin $http_origin;
        proxy_set_header Connection close;
        proxy_http_version 1.1;
        proxy_request_buffering on;
        proxy_buffering on;
        proxy_connect_timeout 5s;
        proxy_read_timeout 35s;
        # Never replay a mutation after an ambiguous upstream outcome.
        proxy_next_upstream off;
    }
}
