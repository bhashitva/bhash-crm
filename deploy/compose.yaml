name: bhash-crm
services:
  crm:
    build:
      context: ..
      dockerfile: Dockerfile
    image: bhash-crm:local
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "127.0.0.1:${CRM_HTTP_PORT:-8092}:8080"
    command:
      - --bind=0.0.0.0
      - --port=8080
      - --db=/data/crm.db
      - --origin=${CRM_ORIGIN:-https://bhashcrm.bhashitva.org}
    environment:
      CRM_PUBLIC_HOST: ${CRM_PUBLIC_HOST:-bhashcrm.bhashitva.org}
      CRM_SIGNUP_ENABLED: ${CRM_SIGNUP_ENABLED:-false}
      CRM_TURNSTILE_SITE_KEY: ${CRM_TURNSTILE_SITE_KEY:-}
      CRM_TURNSTILE_SECRET_KEY: ${CRM_TURNSTILE_SECRET_KEY:-}
      CRM_RESEND_API_KEY: ${CRM_RESEND_API_KEY:-}
      CRM_MAIL_FROM: ${CRM_MAIL_FROM:-info@bhashitva.org}
      CRM_SIGNUP_HOST: ${CRM_PUBLIC_HOST:-bhashcrm.bhashitva.org}
      LANG: C.UTF-8
    volumes:
      - crm_data:/data
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,exec,size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    mem_limit: 512m
    pids_limit: 100
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
volumes:
  crm_data:
